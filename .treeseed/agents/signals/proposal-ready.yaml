schemaVersion: treeseed.agent-signal/v1
id: proposal-ready
label: Proposal ready for deliberation
description: Announces an objective-bound proposal version with immutable evidence provenance.
subjectKinds: [proposal]
allowedOrigins: [treedx-change, deterministic-handler, agent-tool]
payloadSchema: { required: [proposalId, version, objective, proposalTypes, commitSha, digest] }
filterableFields: [objective, proposalTypes, priority, authorAgentId]
commitEvidence: required
allowedProducerClasses: [guide-steward, knowledge-cartography]
subscriberActivityProfiles: [estimating, reviewing, reporting]
idempotency: commit-subject
supersession: replace-subject
coalescing: latest-subject
evidenceRequirements: [proposal-version, content-receipt, readiness]
relationSemantics: [proposes]

