allowedProducerClasses: [workday-control]
subscriberActivityProfiles: [planning]
idempotency: causation-subject
supersession: replace-subject
coalescing: latest-subject
evidenceRequirements: [workday-record, graph-snapshot]
relationSemantics: [opens]

